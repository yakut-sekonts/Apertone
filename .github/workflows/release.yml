name: macOS Release
on:
  push:
    branches: ['codex/release-*', '!codex/release-recovery-*']
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build-package:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - name: Validate release source
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(uname -m)" = arm64
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            git merge-base --is-ancestor HEAD origin/main
          fi
      - name: Install fixed toolchain and Qt
        run: ./scripts/bootstrap.sh
      - name: Configure and build
        run: |
          .tools/venv/bin/cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_MAKE_PROGRAM="$PWD/.tools/venv/bin/ninja"
          .tools/venv/bin/cmake --build build --parallel 3
      - name: Tests and static analysis
        run: |
          .tools/venv/bin/ctest --test-dir build --output-on-failure
          ./scripts/check-format.sh
          ./scripts/check-tidy.sh build
      - name: Package ZIP and DMG
        run: ./scripts/release-artifacts.sh build
      - name: Verify standalone application
        run: .tools/venv/bin/python scripts/verify-bundle.py
      - name: Sign update archive and prepare appcast
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo 'Configure repository secret SPARKLE_PRIVATE_KEY before publishing updater-enabled releases.' >&2
            exit 1
          fi
          .tools/venv/bin/python scripts/create-appcast.py --signer build/_deps/sparkle-src/bin/sign_update
      - name: Upload verified assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-release
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-release
          path: dist/release
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish-release.py
