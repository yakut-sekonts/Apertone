name: Recover verified release publication
on:
  push:
    branches: [codex/release-recovery-0.3.0]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v0.3.0
      build_run_id:
        description: Original tag workflow run with a successful build-package job
        required: true
        default: '38257162809'
permissions:
  contents: read
  actions: read
concurrency:
  group: release-publication-${{ inputs.tag || 'v0.3.0' }}
  cancel-in-progress: false
jobs:
  verify-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.verify.outputs.source_sha }}
      tag: ${{ steps.verify.outputs.tag }}
      run_id: ${{ steps.verify.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - name: Test draft publication recovery
        run: |
          python tests/integration/release_publisher.py
          python tests/integration/release_build.py
      - name: Verify original tag build
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          LUMA_RELEASE_TAG: ${{ inputs.tag || 'v0.3.0' }}
          LUMA_BUILD_RUN_ID: ${{ inputs.build_run_id || '38257162809' }}
        run: python scripts/verify-release-build.py
  publish:
    needs: verify-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-release
          path: dist/release
          github-token: ${{ github.token }}
          run-id: ${{ needs.verify-build.outputs.run_id }}
      - name: Publish original verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          LUMA_RELEASE_TAG: ${{ needs.verify-build.outputs.tag }}
          LUMA_SOURCE_SHA: ${{ needs.verify-build.outputs.source_sha }}
        run: python scripts/publish-release.py --tag "$LUMA_RELEASE_TAG" --source-commit "$LUMA_SOURCE_SHA"
