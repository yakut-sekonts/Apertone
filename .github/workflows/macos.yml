name: macOS keyboard qualification
on:
  push:
    branches: [codex/qa-3-0-keyboard]
permissions:
  contents: read
concurrency:
  group: keyboard-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  keyboard:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - name: Verify supported architecture
        run: test "$(uname -m)" = arm64
      - name: Install fixed toolchain and Qt
        run: ./scripts/bootstrap.sh
      - name: Build pinned offline Denoise and Sky models
        run: bash scripts/build-bundled-models.sh build/models
      - name: Configure
        run: .tools/venv/bin/cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_MAKE_PROGRAM="$PWD/.tools/venv/bin/ninja"
      - name: Build and attest UX executable
        run: .tools/venv/bin/python tests/ux/build_ux.py --build build
      - name: Qualify the native camera adapter
        run: |
          .tools/venv/bin/cmake --build build --target luma_mac_tether_tests --parallel 3
          .tools/venv/bin/ctest --test-dir build --output-on-failure --tests-regex '^mac-tether-discovery$'
          .tools/venv/bin/clang-tidy -p "$PWD/build" "$PWD/platform/macos/MacTetherCapture.mm"
      - name: Keyboard import edit export at minimum window
        run: .tools/venv/bin/python tests/ux/run_keyboard_workflow_regression.py --build build --runs 3 --require-build-provenance
      - name: Selected-asset keyboard regression
        run: .tools/venv/bin/python tests/ux/run_keyboard_regression.py --build build --runs 3 --require-build-provenance
      - name: PhotoCard flag localization and Develop history
        run: .tools/venv/bin/python tests/ux/run_card_flag_regression.py --build build --runs 3 --require-build-provenance
      - name: Library and Develop navigation preserve pending thumbnails
        run: .tools/venv/bin/python tests/ux/run_ux_suite.py --build build --quality-only --case UX-LIB-005 --runs 3 --require-build-provenance --report build/ux-thumbnail-away-back-report
      - name: Save keyboard reports even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keyboard-evidence
          path: |
            build/ux-keyboard-workflow-report/
            build/ux-keyboard-report/
            build/ux-card-flags-report/
            build/ux-thumbnail-away-back-report/
            build/ux-artifacts/*/**/keyboard-workflow.json
          if-no-files-found: warn
