name: macOS Apple Silicon
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main, 'codex/**']
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - name: Verify supported architecture
        run: test "$(uname -m)" = arm64
      - name: Install fixed toolchain and Qt
        run: ./scripts/bootstrap.sh
      - name: Configure
        run: .tools/venv/bin/cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_MAKE_PROGRAM="$PWD/.tools/venv/bin/ninja"
      - name: Build
        run: .tools/venv/bin/cmake --build build --parallel 3
      - name: Unit and integration tests
        run: .tools/venv/bin/ctest --test-dir build --output-on-failure --label-exclude load
      - name: Build and attest UX executable
        run: .tools/venv/bin/python tests/ux/build_ux.py --build build
      - name: Bounded functional blocking UX checks
        run: .tools/venv/bin/python tests/ux/run_ux_suite.py --build build --suite blocking --quality-only --runs 3 --require-build-provenance
      - name: Supplemental selected-asset keyboard regression
        run: .tools/venv/bin/python tests/ux/run_keyboard_regression.py --build build --runs 3 --require-build-provenance
      - name: Supplemental gradient handle accessibility regressions
        run: .tools/venv/bin/python tests/ux/run_mask_handle_regression.py --build build --runs 3 --require-build-provenance
      - name: Auto Transform completion regression
        run: .tools/venv/bin/python tests/ux/run_ux_suite.py --build build --quality-only --case UX-RACE-005 --runs 3 --require-build-provenance --report build/ux-auto-transform-report
      - name: Upload UX evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ux-blocking-evidence
          path: |
            build/ux-report/
            build/ux-keyboard-report/
            build/ux-mask-handles-report/
            build/ux-auto-transform-report/
            build/ux-build-provenance.json
            build/ux-artifacts/20*/**/result.json
            build/ux-artifacts/20*/**/child-result.json
            build/ux-artifacts/20*/**/metrics.json
            build/ux-artifacts/20*/**/actions.jsonl
            build/ux-artifacts/20*/**/keyboard-activation.json
            build/ux-artifacts/20*/**/dsc006-scroll-trace.json
            build/ux-artifacts/20*/**/msk023-*.json
            build/ux-artifacts/20*/**/race005-*.json
            build/ux-artifacts/20*/**/msk023-*.png
            build/ux-artifacts/20*/**/app.log
            build/ux-artifacts/20*/**/command.json
            build/ux-artifacts/20*/**/before.png
            build/ux-artifacts/20*/**/after.png
            build/ux-artifacts/20*/**/failure.png
            build/ux-artifacts/20*/**/thread-sample.txt
            build/ux-artifacts/20*/**/catalog-copy.sqlite
          if-no-files-found: warn
          retention-days: 7
      - name: clang-format
        run: ./scripts/check-format.sh
      - name: clang-tidy
        run: ./scripts/check-tidy.sh build
