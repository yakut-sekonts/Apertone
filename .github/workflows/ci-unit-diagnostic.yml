name: macOS unit diagnostic
on:
  push:
    branches: ['codex/ci-unit-diagnostic']
permissions:
  contents: read
concurrency:
  group: unit-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-diagnostic:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - name: Verify supported architecture
        run: test "$(uname -m)" = arm64
      - name: Inspect ImageIO behavior before application build
        run: |
          mkdir -p .tools
          xcrun clang++ -std=c++20 -fobjc-arc -I. platform/macos/PhotoMetadataIO.mm core/metadata/DescriptiveMetadata.cpp tests/diagnostics/XmpProbe.mm -framework Foundation -framework ImageIO -framework CoreFoundation -o .tools/xmp-probe
          .tools/xmp-probe tests/assets/images/quadrants.webp > .tools/xmp-probe.log 2>&1
          cat .tools/xmp-probe.log
      - name: Preserve ImageIO diagnostics immediately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: imageio-diagnostic
          path: .tools/xmp-probe.log
          include-hidden-files: true
      - name: Install fixed toolchain and Qt
        run: ./scripts/bootstrap.sh
      - name: Configure
        run: .tools/venv/bin/cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_MAKE_PROGRAM="$PWD/.tools/venv/bin/ninja"
      - name: Build affected unit and integration targets
        run: .tools/venv/bin/cmake --build build --parallel 3 --target luma_photo_metadata_tests luma_library_tests luma_cli Luma
      - name: Reproduce XMP and Library tests
        run: .tools/venv/bin/ctest --test-dir build --output-on-failure -R '^(native-xmp-metadata-lists|library-import-restart)$'
      - name: Build and attest affected UX tests
        run: .tools/venv/bin/python tests/ux/build_ux.py --build build
      - name: Metadata XMP regression
        id: xmp_ux
        continue-on-error: true
        run: .tools/venv/bin/python tests/ux/run_ux_suite.py --build build --quality-only --case UX-P09-META-002 --case UX-P09-META-007 --case UX-P09-XMP-002 --case UX-P09-XMP-003 --case UX-P09-XMP-004 --case UX-P09-XMP-005 --runs 3 --require-build-provenance --report build/ux-metadata-xmp-report
      - name: Library and filmstrip scroll regression
        id: scroll_ux
        continue-on-error: true
        run: .tools/venv/bin/python tests/ux/run_library_scroll_regression.py --build build --runs 3 --require-build-provenance
      - name: PhotoCard regression
        id: card_ux
        continue-on-error: true
        run: .tools/venv/bin/python tests/ux/run_card_flag_regression.py --build build --runs 3 --require-build-provenance
      - name: Require affected UX checks
        if: always()
        env:
          XMP: ${{ steps.xmp_ux.outcome }}
          SCROLL: ${{ steps.scroll_ux.outcome }}
          CARD: ${{ steps.card_ux.outcome }}
        run: test "$XMP" = success && test "$SCROLL" = success && test "$CARD" = success
      - name: Preserve UX diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: affected-ux-diagnostic
          path: |
            build/ux-*/UX_REPORT.json
            build/ux-artifacts/**/actions.jsonl
            build/ux-artifacts/**/library-selection-scroll.json
            build/ux-artifacts/**/card-flags-invariant-failure.json
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ctest-diagnostic
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
            build/Testing/Temporary/CTestCostData.txt
          if-no-files-found: warn
          retention-days: 7
